name: Convert ONNX to CoreML

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision
          pip install onnx onnx2torch
          pip install coremltools

      - name: Convert
        run: |
          python -c "
          import onnx
          import torch
          import onnx2torch
          import coremltools as ct
          
          onnx_model = onnx.load('small.onnx')
          torch_model = onnx2torch.convert(onnx_model)
          torch_model.eval()
          
          dummy = torch.randn(1, 3, 640, 640)
          traced = torch.jit.trace(torch_model, dummy)
          
          mlmodel = ct.convert(traced, inputs=[ct.TensorType(shape=dummy.shape)])
          mlmodel.save('XiangqiDetector.mlmodel')
          print('转换成功')
          "

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: coreml-model
          path: XiangqiDetector.mlmodel
