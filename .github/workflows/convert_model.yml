name: Convert ONNX to CoreML

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install coremltools
        run: |
          pip install coremltools onnx onnxruntime

      - name: Convert ONNX to CoreML
        run: |
          python -c "
          import coremltools as ct
          model = ct.convert('small.onnx', minimum_deployment_target=ct.target.iOS15)
          model.save('XiangqiDetector.mlmodel')
          print('转换完成')
          "

      - name: Upload mlmodel
        uses: actions/upload-artifact@v4
        with:
          name: coreml-model
          path: XiangqiDetector.mlmodel
