name: Convert ONNX to CoreML

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install numpy prebuilt
        run: |
          pip install --upgrade pip
          pip install "numpy==1.19.5"

      - name: Install coremltools
        run: |
          pip install coremltools==4.1 onnx

      - name: Convert ONNX to CoreML
        run: |
          python -c "
          import coremltools as ct
          model = ct.converters.onnx.convert('small.onnx', minimum_ios_deployment_target='15')
          model.save('XiangqiDetector.mlmodel')
          print('转换成功')
          "

      - name: Upload mlmodel
        uses: actions/upload-artifact@v4
        with:
          name: coreml-model
          path: XiangqiDetector.mlmodel
